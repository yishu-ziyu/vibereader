<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VibeReader Knowledge Workbench · Architecture 0 报告</title>
<style>
  :root{
    --bg:#0a0f1c; --panel:#0e1626; --panel2:#111c30; --line:rgba(148,163,184,.16);
    --ink:#cbd5e1; --muted:#64748b; --amber:#fbbf24; --debt:#f87171; --store:#5eead4;
    --http:#93c5fd; --ok:#a3e635;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{
    background:
      linear-gradient(rgba(148,163,184,.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(148,163,184,.045) 1px, transparent 1px),
      radial-gradient(1200px 700px at 70% -10%, #12203a 0%, var(--bg) 60%);
    background-size:32px 32px, 32px 32px, cover;
    color:var(--ink);
    font:14px/1.65 -apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    display:flex; flex-direction:column; overflow:hidden;
  }
  h1,h2,h3{font-family:"Songti SC","STSong","Noto Serif SC",serif; font-weight:700; letter-spacing:.02em}
  code,.mono{font-family:"SF Mono",Menlo,Consolas,monospace}

  header{
    display:flex; align-items:baseline; gap:16px; padding:14px 22px 10px;
    border-bottom:1px solid var(--line); flex-wrap:wrap;
  }
  header h1{font-size:20px; color:#e2e8f0}
  header h1 em{color:var(--amber); font-style:normal}
  header .meta{color:var(--muted); font-size:12px}
  .tabs{margin-left:auto; display:flex; gap:6px}
  .tab{
    padding:5px 14px; border:1px solid var(--line); border-radius:3px; cursor:pointer;
    color:var(--muted); font-size:13px; background:transparent;
  }
  .tab.on{color:#0a0f1c; background:var(--amber); border-color:var(--amber); font-weight:600}

  main{flex:1; display:flex; min-height:0}
  /* ===== 画布区 ===== */
  #stage{flex:1; position:relative; min-width:0}
  svg#arch{width:100%; height:100%; display:block; cursor:grab}
  svg#arch.dragging{cursor:grabbing}
  .zoombar{position:absolute; top:12px; right:12px; display:flex; gap:6px}
  .zoombar button{
    width:32px; height:30px; border:1px solid var(--line); background:rgba(14,22,38,.9);
    color:var(--ink); border-radius:3px; cursor:pointer; font-size:14px;
  }
  .zoombar button:hover{border-color:var(--amber); color:var(--amber)}
  .legend{
    position:absolute; left:12px; bottom:12px; padding:8px 12px; font-size:11.5px; color:var(--muted);
    background:rgba(10,15,28,.85); border:1px solid var(--line); border-radius:3px; line-height:2;
  }
  .legend i{display:inline-block; width:18px; height:0; border-top:2px solid; margin-right:6px; vertical-align:middle}
  .bandlabel{fill:#475569; font-size:11px; letter-spacing:.25em; font-family:"SF Mono",Menlo,monospace}

  /* SVG 节点 */
  .node{cursor:pointer}
  .node rect.box{fill:rgba(17,28,48,.92); stroke:rgba(148,163,184,.4); stroke-width:1.2; rx:4}
  .node:hover rect.box{stroke:var(--amber); stroke-width:1.6}
  .node.hl rect.box{stroke:var(--amber); stroke-width:2.2; fill:rgba(60,45,10,.5)}
  .node.dim{opacity:.18}
  .node .t{fill:#e2e8f0; font-size:14px; font-weight:600}
  .node .s{fill:#94a3b8; font-size:11px}
  .node .m{fill:#5eead4; font-size:10.5px; font-family:"SF Mono",Menlo,monospace}
  .badge{fill:#7f1d1d; stroke:var(--debt)}
  .badge text{fill:#fecaca; font-size:9px; font-family:"SF Mono",Menlo,monospace}
  .edge{stroke:rgba(148,163,184,.5); stroke-width:1.4; fill:none}
  .edge.dashed{stroke-dasharray:5 4}
  .edge.dotted{stroke-dasharray:2 4; stroke:#818cf8}
  .edge.red{stroke:var(--debt); stroke-dasharray:5 4}
  .edge.amber{stroke:var(--amber); stroke-width:2}
  .edge.amberflow{stroke:var(--amber); stroke-width:2.4; fill:none; stroke-dasharray:8 6; animation:dash 1s linear infinite}
  @keyframes dash{to{stroke-dashoffset:-14}}
  .elabel{fill:#94a3b8; font-size:10.5px; paint-order:stroke; stroke:#0a0f1c; stroke-width:4px}
  .elabel.red{fill:var(--debt)} .elabel.amber{fill:var(--amber)}

  /* ===== 侧栏 ===== */
  aside{
    width:360px; border-left:1px solid var(--line); background:var(--panel);
    display:flex; flex-direction:column; min-height:0;
  }
  aside .head{padding:12px 16px 8px; border-bottom:1px solid var(--line); display:flex; gap:8px}
  .chip{padding:3px 10px; font-size:12px; border:1px solid var(--line); border-radius:2px; cursor:pointer; color:var(--muted)}
  .chip.on{color:var(--amber); border-color:var(--amber)}
  #sidebody{flex:1; overflow-y:auto; padding:12px 16px 20px}
  .flow{border:1px solid var(--line); border-radius:4px; margin-bottom:10px; overflow:hidden}
  .flow>.t{padding:9px 12px; cursor:pointer; font-weight:600; color:#e2e8f0; display:flex; justify-content:space-between}
  .flow>.t small{color:var(--muted); font-weight:400}
  .flow ol{display:none; list-style:none; counter-reset:st}
  .flow.open ol{display:block}
  .flow li{
    counter-increment:st; padding:8px 12px 8px 38px; position:relative; cursor:pointer;
    border-top:1px solid var(--line); font-size:12.5px; color:var(--ink);
  }
  .flow li::before{
    content:counter(st); position:absolute; left:12px; top:9px; width:17px; height:17px;
    border:1px solid var(--muted); border-radius:50%; font-size:10px; color:var(--muted);
    display:flex; align-items:center; justify-content:center; font-family:"SF Mono",Menlo,monospace;
  }
  .flow li.on{background:rgba(251,191,36,.12); color:#fde68a}
  .flow li.on::before{border-color:var(--amber); color:var(--amber)}
  .insp h3{font-size:16px; color:#fde68a; margin-bottom:8px}
  .insp section{margin-bottom:14px}
  .insp b{color:#e2e8f0; font-size:12px; display:block; margin-bottom:3px; letter-spacing:.08em}
  .insp p, .insp li{font-size:12.5px; color:var(--ink)}
  .insp ul{padding-left:16px}
  .insp .dt{color:#fca5a5; font-size:12px; cursor:pointer}
  .insp .dt:hover{text-decoration:underline}
  .insp code{color:var(--store); font-size:11.5px}
  .hint{color:var(--muted); font-size:12px; padding:8px 0}

  /* ===== 债务页 ===== */
  #debtview{flex:1; overflow-y:auto; padding:20px 28px 40px; display:none}
  .debtgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:14px; margin-top:14px}
  .dcard{border:1px solid var(--line); border-left:3px solid var(--debt); border-radius:4px; background:var(--panel); padding:13px 15px}
  .dcard.sev-中{border-left-color:var(--amber)} .dcard.sev-低{border-left-color:#64748b}
  .dcard h3{font-size:14.5px; color:#e2e8f0; margin-bottom:6px}
  .dcard h3 .did{color:var(--debt); font-family:"SF Mono",Menlo,monospace; font-size:12px; margin-right:6px}
  .dcard.sev-中 h3 .did{color:var(--amber)} .dcard.sev-低 h3 .did{color:#94a3b8}
  .dcard .sev{float:right; font-size:10.5px; color:var(--muted); border:1px solid var(--line); padding:1px 7px; border-radius:2px}
  .dcard p{font-size:12px; color:var(--ink); margin-bottom:6px}
  .dcard .ev{font-size:11px; color:var(--muted)}
  .dcard .ev code{color:var(--store); font-size:10.5px}
  .dcard .rem{font-size:12px; color:#86efac; margin-top:6px}
  .dcard .rem::before{content:"补救 "; color:var(--muted); font-size:10.5px}
  .grouphead{margin:22px 0 2px; color:var(--amber); font-size:13px; letter-spacing:.2em; font-family:"SF Mono",Menlo,monospace}
</style>
</head>
<body>

<header>
  <h1>VibeReader Knowledge Workbench <em>· Architecture 0</em></h1>
  <span class="meta">从代码证据重构 · 2026-08-31 · 配套文档 docs/design/workbench-architecture-0/DESIGN.md</span>
  <nav class="tabs">
    <button class="tab on" data-v="arch">架构总览</button>
    <button class="tab" data-v="debt">架构债清单 (18)</button>
  </nav>
</header>

<main>
  <div id="stage">
    <svg id="arch" viewBox="0 0 1640 1020" preserveAspectRatio="xMidYMid meet"></svg>

      <button id="zin" title="放大">+</button>
      <button id="zfit" title="适配" style="width:40px">Fit</button>
    </div>
    <div class="legend">

    </div>
  </div>

  <aside id="archside">
    <div class="head">

      <span class="chip" data-p="insp">检查器</span>
    </div>
    <div id="sidebody"></div>
  </aside>

  <div id="debtview"></div>
</main>

/* ================= SVG 构建 ================= */
const svg = document.getElementById('arch');
const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, parent){ const e=document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); (parent||svg).appendChild(e); return e; }
function txt(x,y,s,cls,parent){ const t=el('text',{x,y,class:cls||''},parent); t.textContent=s; return t; }

const BANDS=[
  {y:36,  t:'PRODUCT GOVERNANCE'},
  {y:196, t:'CLIENT · apps/reader'},
  {y:546, t:'CLIENT AUTHORITY'},
  {y:196, t:'', x:800, w:830, service:true},
  {y:546, t:'SERVICE STORAGE · services/uni-rag/data', x:800},
  {y:790, t:'EXTERNAL', x:800},
];
function drawBands(){
  const band=(x,y,w,h,label)=>{
    el('rect',{x,y,width:w,height:h,fill:'none',stroke:'rgba(148,163,184,.10)','stroke-dasharray':'3 5',rx:6});
    txt(x+12,y-8,label,'bandlabel');
  };
  band(20,60,770,120,'PRODUCT GOVERNANCE');
  band(20,220,770,410,'CLIENT · apps/reader');
  band(20,590,770,170,'CLIENT AUTHORITY · Tauri / Browser');
  band(800,220,820,410,'SERVICE · services/uni-rag');
  band(800,590,820,170,'SERVICE STORAGE · data/');
  band(800,830,820,140,'EXTERNAL');
}
const BOX = {
  'mgmt':  {x:40,  y:78,  w:360, h:86,  s:'docs/ ADR · .ship 生命周期 · scripts', m:'packages/shared-contracts/…/v1', debts:['D2']},
  'r-ui':  {x:40,  y:246, w:330, h:100, s:'React 18 · Zustand · Tauri WebView', m:'PDF/MD 阅读 · 标注 · 对话 · 卡片', debts:['D7','D8']},
  'r-agent':{x:40,  y:386, w:330, h:120, s:'runtime 循环 · taskRunner · multiAgent', m:'7 技能 · 提示词=docs/*.md 单一来源', debts:['D9']},
  'r-svc': {x:420, y:246, w:330, h:260, s:'唯一外部边界 / 双轨存储网关', m:'ragEngineAdapter · knowledgeService', m2:'savedMemoryService · persistentStorage', debts:['D3','D6']},
  'r-rust':{x:40,  y:616, w:350, h:120, s:'vibereader.sqlite3 · 13 表 · 30+ 命令', m:'documents+unirag_source_id/knowledge_status', debts:['D4']},
  'r-web': {x:420, y:616, w:340, h:120, s:'IndexedDB(会话) · localStorage(文档/卡片)', m:'ai-chat.modelConfigs ← API key 明文', debts:['D3','D5']},
  'u-api': {x:820, y:246, w:420, h:280, s:'FastAPI · prefix=/api · :8766', m:'query · ingest/jobs · memory/jobs', m2:'kbs · sessions · export · health', debts:['D11','D17','D18']},
  'u-ing': {x:820, y:398, w:0,   h:0,  inner:true},
  'u-ret': {x:820, y:398, w:0,   h:0,  inner:true},
  'u-store':{x:820,y:616, w:420, h:120, s:'uploads · chroma · bm25 · parsed/', m:'memory.db · sessions.db · kbs.db', debts:['D12','D13']},

};
function drawNodes(){
  for(const id in BOX){
    const b=BOX[id]; if(b.inner) continue;
    const g=el('g',{class:'node','data-id':id});
    el('rect',{class:'box',x:b.x,y:b.y,width:b.w,height:b.h,rx:4},g);
    txt(b.x+14,b.y+24,NODES[id].name,'t',g);
    txt(b.x+14,b.y+44,b.s,'s',g);
    txt(b.x+14,b.y+63,b.m,'m',g);
    if(b.m2) txt(b.x+14,b.y+80,b.m2,'m',g);
    (b.debts||[]).forEach((d,i)=>{
      const bx=b.x+b.w-34, by=b.y+8+i*15;
      el('rect',{class:'badge',x:bx,y:by,width:27,height:12,rx:2},g);
      txt(bx+4,by+9.5,d,'',g);
    });
    g.addEventListener('click',ev=>{ev.stopPropagation(); inspect(id);});
  }
  // u-api 内部模块行
  const g=el('g',{class:'node','data-id':'u-api'});
  txt(834, 510,'模块：api/routes(25+端点) · ingest(MinerU→chunk→embed) · retrieve(混合+重排) · cite(locator+verifier≥0.45)','m',g);
}
function anchor(id,side){
  const b=BOX[id];
  if(side==='r') return {x:b.x+b.w, y:b.y+b.h/2};
  if(side==='l') return {x:b.x, y:b.y+b.h/2};
  if(side==='t') return {x:b.x+b.w/2, y:b.y};
  return {x:b.x+b.w/2, y:b.y+b.h};
}
function edgeD(e){
  const a=anchor(e.from, e.from==='r-ui'&&e.to==='ext'?'r':'r');
  let A,B;
  if(e.id==='e1'){A=anchor('r-svc','b');B=anchor('r-rust','t');}
  else if(e.id==='e2'){A={x:BOX['r-svc'].x+80,y:BOX['r-svc'].y+BOX['r-svc'].h};B=anchor('r-web','t');}
  else if(e.id==='e3'){A={x:BOX['r-svc'].x+BOX['r-svc'].w,y:300};B={x:BOX['u-api'].x,y:300};}
  else if(e.id==='e3b'){A={x:BOX['r-svc'].x+BOX['r-svc'].w,y:420};B={x:BOX['u-api'].x,y:420};}
  else if(e.id==='e4'){A=anchor('r-agent','r');B={x:BOX['r-svc'].x,y:BOX['r-svc'].y+200};}
  else if(e.id==='e5'){A={x:920,y:BOX['u-api'].y+BOX['u-api'].h};B={x:920,y:BOX['u-store'].y};}
  else if(e.id==='e6'){A={x:920,y:BOX['u-store'].y};B={x:920,y:BOX['u-store'].y};}
  else if(e.id==='e7'){A={x:1140,y:BOX['u-api'].y+BOX['u-api'].h};B={x:1140,y:BOX['u-store'].y};}
  else if(e.id==='e8'){A={x:1140,y:BOX['u-store'].y};B={x:1140,y:BOX['u-store'].y};}
  else if(e.id==='e9'){A={x:900,y:BOX['u-store'].y+BOX['u-store'].h};B={x:900,y:BOX['ext'].y};}
  else if(e.id==='e10'){A={x:1160,y:BOX['u-store'].y+BOX['u-store'].h};B={x:1160,y:BOX['ext'].y};}
  else if(e.id==='e11'){A={x:BOX['r-ui'].x+BOX['r-ui'].w,y:280};B={x:BOX['ext'].x,y:BOX['ext'].y+70};}
  else if(e.id==='e12'){A={x:BOX['mgmt'].x+BOX['mgmt'].w,y:100};B={x:BOX['u-api'].x,y:250};}
  else {A=anchor('mgmt','b');B=anchor('r-svc','t');}
  const mx=(A.x+B.x)/2;
  return `M${A.x},${A.y} C${mx},${A.y} ${mx},${B.y} ${B.x},${B.y}`;
}
const edgeEls={};
function drawEdges(){
  EDGES.forEach(e=>{
    if(e.id==='e6'||e.id==='e8') return; // 垂直短线由 e5/e7 覆盖
    const p=el('path',{class:e.cls,d:edgeD(e),'data-eid':e.id});
    if(e.debt){
      const mid=p.getPointAtLength(p.getTotalLength()*0.5);
      el('rect',{class:'badge',x:mid.x+6,y:mid.y-14,width:27,height:12,rx:2});
      txt(mid.x+10,mid.y-4.5,e.debt,'');
    }
    if(e.label){
      const mid=p.getPointAtLength(p.getTotalLength()*(e.id==='e3b'?0.5:0.5));
      const t=txt(mid.x, mid.y-6, e.label, 'elabel'+(e.cls.includes('red')?' red':''));
      t.setAttribute('text-anchor','middle');
    }
    edgeEls[e.id]=p;
  });
}
function drawAll(){ drawBands(); drawEdges(); drawNodes(); }
drawAll();

/* ================= 缩放平移 ================= */
let vb={x:0,y:0,w:1640,h:1020};
function applyVB(){ svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`); }
function zoom(f,cx,cy){
  const nw=Math.min(4000,Math.max(500,vb.w*f)); const r=nw/vb.w;
  cx=cx??vb.x+vb.w/2; cy=cy??vb.y+vb.h/2;
  vb={x:cx-(cx-vb.x)*r, y:cy-(cy-vb.y)*r, w:nw, h:vb.h*r}; applyVB();
}
svg.addEventListener('wheel',e=>{e.preventDefault(); zoom(e.deltaY>0?1.12:0.89, vb.x+e.offsetX/vb.clientWidth*vb.w, vb.y+e.offsetY/vb.clientHeight*vb.h);},{passive:false});
let drag=null;
svg.addEventListener('mousedown',e=>{drag={x:e.clientX,y:e.clientY,vx:vb.x,vy:vb.y}; svg.classList.add('dragging');});
window.addEventListener('mousemove',e=>{ if(!drag)return; vb.x=drag.vx-(e.clientX-drag.x)*vb.w/svg.clientWidth; vb.y=drag.vy-(e.clientY-drag.y)*vb.h/svg.clientHeight; applyVB();});
window.addEventListener('mouseup',()=>{drag=null; svg.classList.remove('dragging');});
document.getElementById('zin').onclick=()=>zoom(0.8);
document.getElementById('zout').onclick=()=>zoom(1.25);
document.getElementById('zfit').onclick=()=>{vb={x:0,y:0,w:1640,h:1020}; applyVB();};

/* ================= 侧栏：流程 & 检查器 ================= */
const sidebody=document.getElementById('sidebody');
let curPanel='flows';
function renderFlows(){
  sidebody.innerHTML='<div class="hint">点击流程名展开，点击步骤在图上高亮追踪。</div>';
  FLOWS.forEach((f,fi)=>{
    const d=document.createElement('div'); d.className='flow';
    d.innerHTML=`<div class="t">${f.name}<small>${f.steps.length} 步</small></div><ol>${f.steps.map((s,i)=>`<li data-f="${fi}" data-i="${i}">${s.t}${s.fx?' <span style="color:#a3e635">✦本次修复</span>':''}${s.debt?` <span class="dt" data-d="${s.debt}">[${s.debt}]</span>`:''}</li>`).join('')}</ol>`;
    d.querySelector('.t').onclick=()=>d.classList.toggle('open');
    d.querySelectorAll('li').forEach(li=>li.onclick=ev=>{
      if(ev.target.classList.contains('dt')){ showDebt(ev.target.dataset.d); return; }
      d.querySelectorAll('li').forEach(x=>x.classList.remove('on')); li.classList.add('on');
      const st=f.steps[+li.dataset.i];
      document.querySelectorAll('.node').forEach(n=>{
        n.classList.toggle('hl', st.n.includes(n.dataset.id));
        n.classList.toggle('dim', !st.n.includes(n.dataset.id));
      });
    });
    sidebody.appendChild(d);
  });
}
function inspect(id){
  document.querySelectorAll('.node').forEach(n=>n.classList.toggle('hl',n.dataset.id===id));
  setPanel('insp');
  const n=NODES[id];
  sidebody.innerHTML=`<div class="insp">
    <h3>${n.name}</h3>
    <section><b>职责</b><p>${n.role}</p></section>
    <section><b>技术</b><p>${n.tech}</p></section>
    <section><b>连接</b><ul>${n.conn.map(c=>`<li>${c}</li>`).join('')}</ul></section>
    ${n.debts?`<section><b>相关架构债</b>${n.debts.map(d=>`<p class="dt" data-d="${d}">${d} · ${DEBTS.flatMap(g=>g.items).find(x=>x.id===d)?.t||''}</p>`).join('')}</section>`:''}
    <p class="hint">点击左上「关键流程」返回流程列表。</p>
  </div>`;
  sidebody.querySelectorAll('.dt').forEach(x=>x.onclick=()=>showDebt(x.dataset.d));
}
function setPanel(p){
  curPanel=p;
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.p===p));
  if(p==='flows'){ clearHL(); renderFlows(); }
}
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>setPanel(c.dataset.p));
function clearHL(){ document.querySelectorAll('.node').forEach(n=>{n.classList.remove('hl','dim');}); }
svg.addEventListener('click',()=>{ if(curPanel==='insp') setPanel('flows'); else clearHL(); });

/* ================= 债务页 ================= */
const debtview=document.getElementById('debtview');
function renderDebts(){
  debtview.innerHTML=`<h2 style="color:#e2e8f0;font-size:18px">架构债清单 · 18 项</h2>
  <p style="color:var(--muted);font-size:12.5px;margin-top:4px">严重度 = 影响面 × 可逆性。✦ 绿字 = 本次已修复（D1 D2 D4 D7 D9 D10 D13 D14）。证据均为代码文件引用。</p>
  <div id="dg"></div>`;
  const dg=debtview.querySelector('#dg');
  DEBTS.forEach(g=>{
    const h=document.createElement('div'); h.className='grouphead'; h.textContent=g.g; dg.appendChild(h);
    const grid=document.createElement('div'); grid.className='debtgrid'; dg.appendChild(grid);
    g.items.forEach(d=>{
      const fixed=d.r.startsWith('已修复')||d.r.includes('已修复');
      const c=document.createElement('div'); c.className='dcard sev-'+d.sev;
      c.innerHTML=`<span class="sev">${d.sev} · ${fixed?'已修复':'待处理'}</span><h3><span class="did">${d.id}</span>${d.t}</h3><p>${d.p}</p><p class="ev">证据 <code>${d.ev}</code></p><p class="rem">${d.r}</p>`;
      grid.appendChild(c);
    });
  });
}
function showDebt(id){ switchView('debt'); debtview.scrollTop=0; const card=[...debtview.querySelectorAll('.dcard')].find(c=>c.textContent.includes(id)); if(card){card.scrollIntoView({behavior:'smooth',block:'center'}); card.style.outline='1px solid var(--amber)'; setTimeout(()=>card.style.outline='',1600);} }

/* ================= 视图切换 ================= */
function switchView(v){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.v===v));
  document.getElementById('stage').style.display=v==='arch'?'':'none';
  document.getElementById('archside').style.display=v==='arch'?'':'none';
  debtview.style.display=v==='debt'?'block':'none';
  if(v==='debt') renderDebts();
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>switchView(t.dataset.v));
renderFlows();
